contract: 3

# Keyso expands this to three independent language configurations.
languages:
  cxx:
    _nested:
      standard: [17, 20, 23]

build:
  feature-sets: >
    cmake -S "{{source}}" -B "{{tmpdir}}" -G Ninja
    -DCMAKE_CXX_STANDARD="{{cxx.standard}}"
    -DCPDOCS_FEATURE_SETS_OUTPUT="{{output-file}}"
  build: >
    cmake -S "{{source}}" -B "{{tmpdir}}" -G Ninja
    -DCMAKE_CXX_STANDARD="{{cxx.standard}}"
    -DCPDOCS_FEATURE_SET="{{feature-set}}"
    -DCPDOCS_MANIFEST_OUTPUT="{{output-file}}"
    && cmake --build "{{tmpdir}}" --target cpdocs_standard_demo

site:
  copyright: Copyright © cpdocs example developers · Apache-2.0

checks:
  broken-references: fail

versions: [main]
