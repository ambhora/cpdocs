name: documentation

# The published site is always built from the default branch: with the full history, cpdocs
# documents every configured branch and tag from there. The github-pages environment only accepts
# deployments from the default branch, so a pushed tag does not deploy itself; it starts this
# workflow on the default branch, whose build then includes the new tag.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-for-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the site on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >
          gh workflow run docs.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$DEFAULT_BRANCH"

  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      # The build runs the example projects' build commands; they get no Git credentials.
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v6.8.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - name: Install toolchain for the C and C++ examples
        run: sudo apt-get install -y --no-install-recommends clang ninja-build
      - name: Install CMake 4.3
        run: |
          uv tool install --python 3.12 cmake==4.3.4
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Verify CMake version
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version 4.3.4"
      - name: Install toolchain for the Rust example
        run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - name: Build documentation
        run: uv run --locked properdocs build --strict
      # v3.0.1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/site

  deploy:
    if: >
      github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        # v4.0.5
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
