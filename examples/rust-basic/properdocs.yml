site_name: Rust cpdocs example
site_description: A minimal Cargo/Rust API rendered from nightly rustdoc JSON by cpdocs.
docs_dir: docs
site_dir: build/site
plugins:
  - search
  - cpdocs:
      mount: reference/api

theme:
  name: materialx
  features:
    - navigation.instant
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - API reference: api.md
