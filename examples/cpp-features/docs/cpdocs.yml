contract: 1

build:
  describe:
    - [cmake, -S, "{source}", -B, "{build}", -G, Ninja,
       "-DCPDOCS_REQUEST={request}",
       "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES={cpdocs.cmake}"]

site:
  copyright: Copyright © cpdocs example developers · Apache-2.0

api:
  hide:
    cpp-namespaces: ["*::detail"]

checks:
  broken-references: fail
  undocumented: fail

versions:
  # The examples share the branches and tags of the cpdocs repository; refs from before an
  # example existed, or before it had docs/cpdocs.yml, are skipped.
  branches:
    include: [main]
    variants: all
  tags:
    select: all
    variants: all
  default: latest-tag
  aliases: {stable: latest-tag, dev: main}
  legacy: skip
