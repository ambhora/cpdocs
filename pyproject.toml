[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cpdocs"
dynamic = ["version"]
description = "Semantic, versioned API documentation for C, C++, CUDA, HIP, Fortran, Python and Rust projects"
readme = "readme.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jayesh Badwaik", email = "j.badwaik@fz-juelich.de" }]
dependencies = [
  "brandgen",
  "keyso>=0.2.0",
  # The Python implementation of Korml, published from ambhora/pykorml; 0.2.0 rejects duplicate
  # keys and bounds input size, token count, parse work and nesting depth.
  "korml>=0.2.0",
  "markdown-it-py>=3",
  "Pygments>=2.17",
]

[project.urls]
Source = "https://github.com/ambhora/cpdocs"

[project.scripts]
cpdocs = "cpdocs.cli:main"

[project.entry-points."properdocs.plugins"]
cpdocs = "cpdocs.plugins.properdocs.plugin:CpdocsPlugin"

[dependency-groups]
# PyYAML reads the GitHub workflows in tests and checks that Korml reads every cpdocs.yml the way
# YAML did.
dev = ["pytest>=8", "ruff>=0.8", "properdocs>=1.6.7", "mkdocs-materialx", "PyYAML>=6"]

[tool.hatch.version]
path = "src/cpdocs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cpdocs"]

[tool.hatch.build.targets.wheel.force-include]
"share" = "share"

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP022"]

[tool.ruff.lint.isort]
known-first-party = ["cpdocs", "conftest"]
