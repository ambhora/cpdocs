contract: 1

# A plain pyproject.toml project needs no configuration step; cpdocs' own helper answers the
# build-system requests for it.
build:
  describe:
    - ["{python}", -m, cpdocs, manifest, python, --request, "{request}",
       --package, dice, --source, src/dice]

checks:
  broken-references: fail
  undocumented: fail

versions:
  # The examples share the branches and tags of the cpdocs repository; refs from before an
  # example existed, or before it had docs/cpdocs.yml, are skipped.
  branches:
    include: [main]
    variants: all
  tags:
    select: all
    variants: all
  default: latest-tag
  aliases: {stable: latest-tag, dev: main}
  legacy: skip
