site_name: cpdocs C++ standards example
docs_dir: docs/web
site_dir: build/site

theme:
  name: materialx
  features:
    - navigation.instant
    - navigation.top
    - search.highlight

plugins:
  - search
  - cpdocs:
      mount: reference/api

nav:
  - Home: index.md
  - API reference: api.md
