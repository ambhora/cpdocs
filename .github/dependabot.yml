# Actions are pinned to commit SHAs; Dependabot proposes new pins, with the matching version
# comment, so the pins are reviewed rather than left to age.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
