name: test

on:
  push:
  pull_request:

# The tests build and run the example projects; they need to read the repository and nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v6.8.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install toolchain for the C and C++ examples
        run: sudo apt-get install -y --no-install-recommends clang ninja-build
      - name: Install CMake 4.3
        run: |
          uv tool install --python 3.12 cmake==4.3.4
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: Verify CMake version
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version 4.3.4"
      - name: Install toolchain for the Rust example
        run: rustup toolchain install nightly-2026-10-01 --profile minimal
      - name: Lint
        run: uv run --locked ruff check && uv run --locked ruff format --check
      - name: Test
        run: uv run --locked pytest -q
