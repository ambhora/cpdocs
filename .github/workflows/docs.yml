name: documentation

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install toolchain for the C and C++ examples
        run: sudo apt-get install -y --no-install-recommends clang cmake ninja-build
      - name: Build documentation
        run: uv run properdocs build --strict
      # Each example is published below examples/<name>/ as its own versioned site.
      - name: Build example sites
        run: uv run python tools/build_example_sites.py --output build/site/examples
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
